# /etc/wsl.conf — dropped inside the Fedora WSL distro by setup-wsl.ps1.
# Enables systemd (recommended for Fedora in WSL2) and enables /mnt/c
# mounting with 'metadata' so Windows files keep usable Linux permissions.

[boot]
systemd=true

[automount]
enabled=true
options="metadata,umask=22,fmask=11"
mountFsTab=true

[interop]
enabled=true
appendWindowsPath=true

[network]
generateResolvConf=true