# The colors i'm using below do not work well with SSH connection.
# I have to do something like:
# `TERM=xterm-256color ssh user@host`
# I may revisit those settings in another time lol :P
# Sets the TERM value for the terminal inside of tmux
set -g default-terminal "tmux-256color"
# Adds True Color (RGB) support for the terminal *outside* of tmux
set -ga terminal-features ",tmux-256color:Tc,xterm-256color:Tc,xterm-ghostty:Tc"
# Enable activity alerts
set -g monitor-activity on
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

# Increase history (buffer size)
set-option -g history-limit 30000
# Set vim motions for almost everything.
set-option -g mode-keys vi

set -g mouse off # I do NOT use mouse
set -g renumber-windows on # Reorder window numbers

# Start windows and panes from 1
set -g base-index 1 # windows
set -g pane-base-index 1 # panes

# Add title to the terminal
set -g set-titles on
# WIP Below (I am trying to find a good balance here)
# It shows and emoji in the title when prefix is pressed.
set -g set-titles-string '#{?#{==:#{SSH_ACTIVE},1},[SSH] ,}\
#{?client_prefix,🅿️,}#S | #I:#W (#D) | #T #{session_alerts} '

setw -g allow-rename off
setw -g automatic-rename off

# This mimics vim when in copy mode. It also copies to Wayland's clipboard.
#Use `<prefix> + [` to enable copy mode and `q` to leave it.
# Use vim motions for actions
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
#bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Bind ctrl+a as prefix
 set -g prefix C-a
 unbind C-b
 bind C-a send-prefix

# <prefix> r (reload) - Reloads .tmux.conf
bind r run-shell -b '\
  tmux source-file ~/.tmux.conf ; \
  tmux display-message "Config reloaded 🌀..."; \
'

# <prefix> Ctrl+l (Lista) - List all windows using fzf
bind C-l run-shell '\
  tmux list-window -a -F "##S:##I ##W ##P ##D" | 
  fzf --sync --tmux center |  
  awk "{print \$1}" | 
  xargs tmux switch-client -t 
'

# Popup Keybinds
# <prefix> Ctrl+n (temp notes) - Opens /tmp/scrach.md in nvim
bind-key C-n display-popup -E -w 60% -h 60% "nvim /tmp/scratch.md"
# <prefix> Ctrl+p (Python REPL) - Opens Python REPL (quit closes)
bind-key C-p display-popup -E -w 60% -h 60% "python"
# <prefix> Ctrl+h (htop) - Opens htop (q closes)
bind-key C-h display-popup -E -w 80% -h 80% "htop"
# <prefix> Ctrl+t (terminal) - Opens a new terminal popup (exit closes)
bind-key C-t display-popup -E -w80% -h80% ""
# <prefix> Ctrl+x (just run) - just recipe run (ESC closes)
bind-key C-x display-popup -w80% -h80% "just run"

# Toggle popup
# https://gist.github.com/LintaoAmons/22f6184b26bd5b93d8fe9f9276f50f75
# Credits goes to the gist above.
# This opens a floating popup and keeps it opened. You can toggle with
# <prefix> Ctrl+w. You can switch sessions, windows and panes. It will
# keep everything intact. You can close it by exiting (exit).
# Resolve the scripts dir from the real path of this file (~/.tmux.conf ->
# repo/tmux/.tmux.conf) so the popup works even if the repo isn't at ~/dotfiles.
bind-key -r C-w run-shell '"$(dirname "$(readlink -f ~/.tmux.conf)")/scripts/popup.sh" \
  float_popup term "${HOME}"'

# THEME
set -g status-left-style NONE
set -g status-right-style NONE

# Status right
set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=black bg=green]#[fg=green bold \
bg=black] #S #D ,#[fg=black bg=green]#[fg=white dim bg=black] #S #D }"

# Messages
set -g message-style "fg=green,bg=black"
set -g message-command-style "fg=green,bg=black"

# Enable status bar
set -g status "on"
set -g status-justify "left"

# Normal window colors. They have the same bg as the status bar
setw -g window-status-style "NONE,fg=black,bg=green"
# Arrow pointing forward in normal windows. Here we have one arrow
# before and other after the text as in:  id:name flags 
# Both arrows have the save bg and fg as the status bar.
setw -g window-status-format "#[fg=green,bg=green]#[default] #I:#W #F \
#[fg=green,bg=green]#[default]"
# The current window also have both arrows, except its bg is black
# and fg green.
setw -g window-status-current-format "#[fg=green,bg=black]#[fg=white,\
bg=black] #I:#W #F #[fg=black,bg=green]#[default]"

# Reset some style if it is configured
setw -g window-status-separator ""
setw -g window-status-activity-style ""

set -g mode-style "fg=green,bg=black"
set -g message-command-style "fg=green,bg=black"
set -g message-style "fg=green,bg=black"

# This is the status default color. These colors have to match the colors
# configured in lines above.
set -g status-style "fg=black,bg=green"

# Status left
set -g status-left-length 100
set -g status-left "#[fg=green bold bg=black]#{?#{!!:#{SSH_CONNECTION}}, [SSH],}\
#{?client_prefix, [#h] ✼ ,\
#[fg=white dim bg=black] [#h] - #[default]}#[fg=black,bg=green]#[default]"
# TPM (Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # 
set -g @plugin 'tmux-plugins/tmux-resurrect' # Save and restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum' # Autorestore

# COntinuum config
set -g @continuum-restore 'on' # restore when i open tmux
# Save in every 5 minuts
set -g @continuum-save-interval '5'

# Start TPM
run '~/.tmux/plugins/tpm/tpm'
